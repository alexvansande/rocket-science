# Rebuild the card kit + playtest report from data/ and publish them to GitHub Pages.
name: Site

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build kit and playtest report
        working-directory: src
        run: |
          mkdir -p ../build
          python3 build_kit.py
          python3 build_table.py
          python3 playtest.py
          python3 tower_search.py
          python3 build_playtest_report.py
      - name: Assemble site
        run: |
          mkdir -p _site
          cp site/* _site/
          cp build/triskelion-kit.html build/playtest-report.html build/table.html _site/
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
